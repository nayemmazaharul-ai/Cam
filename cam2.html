<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CricScore Pro Live Recorder (1080p 60fps)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            color: #fff;
        }

        /* Landscape Orientation Warning for Portrait Mobile */
        #rotate-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #rotate-warning svg {
            width: 60px;
            height: 60px;
            fill: #00e676;
            margin-bottom: 15px;
            animation: rotatePhone 2s infinite ease-in-out;
        }

        @keyframes rotatePhone {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
        }

        @media screen and (orientation: portrait) {
            body:not(.allow-portrait) #rotate-warning {
                display: flex;
            }
        }

        /* Main Studio Container */
        #studio-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Camera Feed */
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Cricscore User Panel Overlay */
        #score-overlay-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking camera controls if needed */
            z-index: 10;
        }

        #cricscore-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            pointer-events: auto; /* Enables interaction with your panel */
        }

        /* Top Status Bar */
        #top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            background-color: #ff1744;
            border-radius: 50%;
            display: none;
        }

        .recording .rec-dot {
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Right Side Control Dock */
        #control-dock {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(10px);
            padding: 16px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 30;
        }

        .ctrl-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 2px;
        }

        /* Record Button Specific */
        #btn-record {
            background: #ff1744;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.5);
        }

        #btn-record.active {
            background: #fff;
            color: #ff1744;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 23, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 23, 68, 0); }
        }

        /* Flash Active State */
        #btn-flash.active {
            background: #ffd600;
            color: #000;
        }

        /* Save Button Specific */
        #btn-save {
            background: #00c853;
            display: none; /* Shows when video is ready to save */
        }

        /* Toggle Panel Interaction Button */
        #btn-panel-toggle.active {
            background: #2979ff;
        }

        /* Toast Notification */
        #toast {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #00e676;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #00e676;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Portrait Warning -->
    <div id="rotate-warning">
        <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/></svg>
        <h2>অনুগ্রহ করে ফোনটি Landscape (আড়াআড়ি) করুন</h2>
        <p style="color:#aaa; margin-top:8px;">1080p 60fps লাইভ রেকর্ডিংয়ের জন্য Landscape মোড আবশ্যক।</p>
        <button id="btn-force-portrait" style="margin-top:20px; padding:10px 20px; border-radius:20px; border:none; background:#00e676; color:#000; font-weight:bold; cursor:pointer;">Portrait মোডেই চালান</button>
    </div>

    <!-- Main Studio Interface -->
    <div id="studio-container">
        
        <!-- Live Camera Video -->
        <video id="camera-feed" autoplay playsinline muted></video>

        <!-- Cricscore User Panel Overlay -->
        <div id="score-overlay-wrapper">
            <iframe id="cricscore-frame" src="https://nayemmazaharul-ai.github.io/Cricscore/" allowtransparency="true"></iframe>
        </div>

        <!-- Top Status Indicators -->
        <div id="top-bar">
            <div class="badge" id="rec-status-badge">
                <span class="rec-dot"></span>
                <span id="rec-timer">00:00:00</span>
            </div>
            <div class="badge">
                <span id="stream-specs">1080P • 60 FPS</span>
            </div>
        </div>

        <!-- Control Buttons -->
        <div id="control-dock">
            <!-- Record / Stop Button -->
            <button class="ctrl-btn" id="btn-record" title="Start/Stop Recording">
                <svg id="icon-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
                <span id="text-rec">REC</span>
            </button>

            <!-- Flash / Torch Button -->
            <button class="ctrl-btn" id="btn-flash" title="Toggle Flashlight">
                <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
                <span>FLASH</span>
            </button>

            <!-- Switch Camera Button -->
            <button class="ctrl-btn" id="btn-cam-switch" title="Switch Camera">
                <svg viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 11.5V13H9v2.5L5.5 12 9 8.5V11h6V8.5l3.5 3.5-3.5 3.5z"/></svg>
                <span>FLIP</span>
            </button>

            <!-- Rotate Orientation Button -->
            <button class="ctrl-btn" id="btn-rotate" title="Toggle Portrait / Landscape">
                <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 24 12 24l.66-.03-3.81-3.81-1.33 1.32z"/></svg>
                <span>ROTATE</span>
            </button>

            <!-- Save Video Button -->
            <button class="ctrl-btn" id="btn-save" title="Save Video to Device">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>SAVE</span>
            </button>
        </div>

        <!-- Toast Message -->
        <div id="toast">মেসেজ</div>
    </div>

    <script>
        const videoElement = document.getElementById('camera-feed');
        const btnRecord = document.getElementById('btn-record');
        const textRec = document.getElementById('text-rec');
        const btnFlash = document.getElementById('btn-flash');
        const btnCamSwitch = document.getElementById('btn-cam-switch');
        const btnRotate = document.getElementById('btn-rotate');
        const btnForcePortrait = document.getElementById('btn-force-portrait');
        const btnSave = document.getElementById('btn-save');
        const recTimer = document.getElementById('rec-timer');
        const recBadge = document.getElementById('rec-status-badge');
        const streamSpecs = document.getElementById('stream-specs');
        const toast = document.getElementById('toast');

        let cameraStream = null;
        let videoTrack = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordedBlobUrl = null;
        let isRecording = false;
        let isFlashOn = false;
        let useFrontCamera = false;
        let isLandscapeLocked = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Show Toast Message
        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3500);
        }

        // Lock Landscape Orientation if supported by browser
        async function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                    isLandscapeLocked = true;
                }
            } catch (e) {
                console.log('Orientation lock requires fullscreen.');
            }
        }

        // Toggle Portrait / Landscape Orientation
        async function toggleOrientation() {
            document.body.classList.add('allow-portrait');
            try {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen().catch(() => {});
                }
                const currentType = (screen.orientation && screen.orientation.type) ? screen.orientation.type : '';
                const isCurrentlyLandscape = currentType.includes('landscape') || window.innerWidth > window.innerHeight;

                if (screen.orientation && screen.orientation.lock) {
                    if (isCurrentlyLandscape) {
                        await screen.orientation.lock('portrait');
                        isLandscapeLocked = false;
                        showToast('Portrait মোড চালু হয়েছে');
                    } else {
                        await screen.orientation.lock('landscape');
                        isLandscapeLocked = true;
                        showToast('Landscape মোড চালু হয়েছে');
                    }
                } else {
                    showToast('ফোন ঘুরিয়ে Portrait / Landscape করুন');
                }
            } catch (err) {
                showToast('Portrait / Landscape পরিবর্তন হয়েছে');
            }
        }

        btnRotate.addEventListener('click', toggleOrientation);
        btnForcePortrait.addEventListener('click', () => {
            document.body.classList.add('allow-portrait');
            if (!cameraStream) startCamera();
            showToast('Portrait মোড সক্রিয় হয়েছে');
        });

        // Initialize 1080p 60fps Camera & Voice
        async function startCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast('আপনার ব্রাউজার বা HTTPS ছাড়া ক্যামেরা সাপোর্ট করছে না।');
                return;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }

            const facing = useFrontCamera ? 'user' : 'environment';

            // Primary high quality constraints + Fallback constraints so camera & voice never fail
            const constraintOptions = [
                {
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: {
                        facingMode: { ideal: facing },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    }
                },
                {
                    audio: true,
                    video: { facingMode: { ideal: facing } }
                },
                {
                    audio: true,
                    video: true
                }
            ];

            let stream = null;
            for (const constraints of constraintOptions) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (stream) break;
                } catch (e) {
                    console.warn('Trying fallback camera constraints...', e);
                }
            }

            if (!stream) {
                showToast('ক্যামেরা ও ভয়েস চালু করতে পারমিশন দিন! (HTTPS প্রয়োজন)');
                return;
            }

            try {
                cameraStream = stream;
                videoElement.srcObject = cameraStream;
                videoElement.muted = true; // Prevent audio echo on speaker while recording mic
                await videoElement.play().catch(() => {});

                videoTrack = cameraStream.getVideoTracks()[0];
                const audioTracks = cameraStream.getAudioTracks();

                // Verify actual achieved resolution, FPS and Mic status
                const settings = videoTrack.getSettings();
                const actualHeight = settings.height || 720;
                const actualFps = Math.round(settings.frameRate || 30);
                const micStatus = audioTracks.length > 0 ? 'MIC ON' : 'NO MIC';
                streamSpecs.textContent = `${actualHeight}P • ${actualFps} FPS • ${micStatus}`;

                // Reset Flash state
                isFlashOn = false;
                btnFlash.classList.remove('active');

            } catch (err) {
                showToast('ক্যামেরা চালু করতে সমস্যা হচ্ছে! পারমিশন চেক করুন।');
                console.error(err);
            }
        }

        // Toggle Flashlight (Torch)
        btnFlash.addEventListener('click', async () => {
            if (!videoTrack) {
                await startCamera();
                if (!videoTrack) return;
            }

            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};

            if (!capabilities.torch) {
                showToast('এই ক্যামেরায় ফ্ল্যাশলাইট সাপোর্ট নেই (ব্যাক ক্যামেরা চেক করুন)।');
                return;
            }

            try {
                isFlashOn = !isFlashOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: isFlashOn }]
                });
                btnFlash.classList.toggle('active', isFlashOn);
                showToast(isFlashOn ? 'ফ্ল্যাশ চালু হয়েছে' : 'ফ্ল্যাশ বন্ধ হয়েছে');
            } catch (err) {
                isFlashOn = false;
                btnFlash.classList.remove('active');
                showToast('ফ্ল্যাশ চালু করা সম্ভব হয়নি।');
            }
        });

        // Switch Front/Back Camera
        btnCamSwitch.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        // Timer Formatting
        function updateTimer() {
            secondsElapsed++;
            const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
            const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            recTimer.textContent = `${hrs}:${mins}:${secs}`;
        }

        // Start / Stop Recording (Captures Camera + Cricscore Overlay)
        btnRecord.addEventListener('click', async () => {
            if (!isRecording) {
                await startCompositeRecording();
            } else {
                stopCompositeRecording();
            }
        });

        async function startCompositeRecording() {
            try {
                if (!cameraStream) {
                    await startCamera();
                }

                // Request Fullscreen for clean 1080p capture
                if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                    await document.documentElement.requestFullscreen().catch(() => {});
                    if (!document.body.classList.contains('allow-portrait')) {
                        lockLandscape();
                    }
                }

                // Capture Current Tab (Camera + Cricscore Iframe Panel together)
                const displayStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: 60 }
                    },
                    audio: true,
                    preferCurrentTab: true
                });

                // Combine Microphone Audio from Camera Stream if available
                const audioTracks = cameraStream ? cameraStream.getAudioTracks() : [];
                const combinedTracks = [
                    ...displayStream.getVideoTracks(),
                    ...audioTracks
                ];
                const finalStream = new MediaStream(combinedTracks);

                recordedChunks = [];
                const mimeType = MediaRecorder.isTypeSupported('video/mp4; codecs=avc1') 
                    ? 'video/mp4; codecs=avc1' 
                    : 'video/webm; codecs=vp9';

                mediaRecorder = new MediaRecorder(finalStream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 12000000 // 12 Mbps High Bitrate for 1080p 60fps
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
                    recordedBlobUrl = URL.createObjectURL(blob);

                    // Auto-trigger download to Local Storage
                    saveToLocalStorage();
                    btnSave.style.display = 'flex';
                    displayStream.getTracks().forEach(t => t.stop());
                };

                // Stop recording if user stops tab sharing from browser bar
                displayStream.getVideoTracks()[0].onended = () => {
                    if (isRecording) stopCompositeRecording();
                };

                mediaRecorder.start(1000);
                isRecording = true;
                btnRecord.classList.add('active');
                textRec.textContent = 'STOP';
                recBadge.classList.add('recording');
                btnSave.style.display = 'none';

                secondsElapsed = 0;
                recTimer.textContent = '00:00:00';
                timerInterval = setInterval(updateTimer, 1000);
                showToast('1080p 60fps লাইভ রেকর্ডিং শুরু হয়েছে!');

            } catch (err) {
                showToast('রেকর্ডিং শুরু হয়নি। ট্যাব শেয়ার পারমিশন দিন।');
                console.error(err);
            }
        }

        function stopCompositeRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            btnRecord.classList.remove('active');
            textRec.textContent = 'REC';
            recBadge.classList.remove('recording');
            clearInterval(timerInterval);
            showToast('রেকর্ডিং সম্পন্ন! লোকাল স্টোরেজে সেভ হচ্ছে...');
        }

        // Save Video File Directly to Local Storage (Downloads Folder)
        function saveToLocalStorage() {
            if (!recordedBlobUrl) return;
            const a = document.createElement('a');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            a.style.display = 'none';
            a.href = recordedBlobUrl;
            a.download = `CricScore_Live_${timestamp}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('ভিডিও লোকাল স্টোরেজে সেভ হয়েছে!');
        }

        btnSave.addEventListener('click', saveToLocalStorage);

        // Initialize App on Load & on first user interaction if blocked
        window.addEventListener('load', () => {
            startCamera();
        });

        document.addEventListener('click', () => {
            if (!cameraStream) {
                startCamera();
            }
        }, { once: true });
    </script>
</body>
</html>
